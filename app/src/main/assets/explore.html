<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FABI - Explore Elite Talent</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0056b3",
                        "background": "#ffffff",
                        "on-background": "#000000",
                        "surface": "#ffffff",
                        "on-surface": "#000000",
                        "outline-variant": "#e0e0e0"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-sans selection:bg-blue-100">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-200 flex justify-between items-center px-4 h-16">
        <a href="index.html" class="flex items-center gap-4">
            <span class="material-symbols-outlined text-black">arrow_back</span>
            <h1 class="text-xl font-bold text-blue-700">FABI</h1>
        </a>
        <div class="flex items-center gap-2">
            <span id="headerUserName" class="text-sm font-bold text-black mr-2"></span>
            <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-200" onclick="Android.openProfile()">
                <img id="headerUserImage" src="https://via.placeholder.com/40" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <main class="pt-20 pb-24 px-4 max-w-4xl mx-auto">
        <!-- Community Section -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold text-black mb-1">Community Professionals</h2>
            <p class="text-gray-600 mb-6">Real professionals from our Kenyan community.</p>

            <div id="realListingContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full py-12 text-center text-gray-400">Loading listings...</div>
            </div>
        </section>

        <!-- Become a Vendor -->
        <section class="mb-12 p-8 bg-black rounded-3xl text-white text-center">
            <h3 class="text-xl font-bold mb-2">Are you a professional?</h3>
            <p class="mb-6 text-gray-300">Join our elite network of Kenyan photographers. Upload your work and set your prices in KSh.</p>
            <button onclick="Android.openAddListing()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all">Add My Work & Pricing</button>
        </section>

        <!-- Weather Section -->
        <section class="mb-12 p-6 bg-blue-50 rounded-3xl border border-blue-100">
            <h3 class="text-lg font-bold text-blue-900 mb-2">Nairobi Weather Status</h3>
            <div id="weatherDisplay" class="text-blue-700 font-bold text-xl mb-4 hidden"></div>
            <button onclick="Android.fetchWeather()" class="px-6 py-2 bg-white border border-blue-200 text-blue-700 rounded-full font-semibold hover:bg-blue-100 transition-all">Update Weather</button>
        </section>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 flex justify-around items-center py-3">
        <a href="index.html" class="flex flex-col items-center text-gray-400"><span class="material-symbols-outlined">home</span><span class="text-xs">Home</span></a>
        <a href="#" class="flex flex-col items-center text-blue-700"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span><span class="text-xs font-bold">Explore</span></a>
        <a onclick="Android.openProfile()" class="flex flex-col items-center text-gray-400"><span class="material-symbols-outlined">person</span><span class="text-xs">Profile</span></a>
    </nav>

    <script>
        let currentUserId = "";
    let currentUserRole = "";
    let isMasterDeveloper = false;

    // Log button clicks to Android EventManager
    document.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') {
            if (typeof Android !== 'undefined') {
                Android.logInteraction('Clicked ' + (e.target.innerText || e.target.getAttribute('data-icon') || 'Link'));
            }
        }
    });

    window.onload = () => {
        if (typeof Android !== 'undefined') {
            Android.fetchListings();
        }
    };

    function updateAuthUI(isLoggedIn, userId, name, role, profilePic, isDev) {
        currentUserId = userId || "";
        currentUserRole = role || "";
        isMasterDeveloper = isDev || false;
        const headerName = document.getElementById('headerUserName');
        const headerImage = document.getElementById('headerUserImage');

        if (headerName) headerName.innerText = name;
        if (headerImage && profilePic) {
            headerImage.src = 'data:image/jpeg;base64,' + profilePic;
        }

        console.log("Explore: User=" + name + ", Role=" + currentUserRole + ", MasterDev=" + isMasterDeveloper);
    }

    function displayRealListings(listings) {
        const container = document.getElementById('realListingContainer');
        if (!container) return;
        container.innerHTML = '';

        if (!listings || listings.length === 0) {
            container.innerHTML = '<div class="col-span-full p-12 text-center bg-gray-50 rounded-3xl border border-dashed border-gray-300 text-gray-500">No listings yet. Be the first to upload!</div>';
            return;
        }

        listings.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-white rounded-2xl overflow-hidden shadow-md border border-gray-100 relative";
            const imageSrc = item.imageBase64 ? `data:image/jpeg;base64,${item.imageBase64}` : 'https://via.placeholder.com/400x300?text=FABI+Pro';

            // Show delete button if owner OR Master Developer
            const allowedRoles = ["Photographer", "Videographer", "DJ / Musician", "Event Planner"];
            const hasPermission = allowedRoles.includes(currentUserRole);
            const isOwner = item.userId === currentUserId;

            const deleteBtn = (isOwner && hasPermission) || isMasterDeveloper ? `
                <button onclick="deleteListing('${item.listingId}')" class="absolute top-3 right-3 bg-red-600 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center hover:bg-red-700 active:scale-90 transition-all z-20">
                    <span class="material-symbols-outlined text-sm">delete</span>
                </button>
            ` : '';

            // Show map link if coordinates exist
            const mapBtn = (item.latitude && item.longitude) ? `
                <button onclick="viewOnMap(${item.latitude}, ${item.longitude}, '${item.name}')" class="flex items-center gap-1 text-blue-600 text-xs font-bold mb-2 hover:underline">
                    <span class="material-symbols-outlined text-sm">location_on</span> View on Google Maps
                </button>
            ` : '';

            div.innerHTML = `
                ${deleteBtn}
                <div class="h-48 bg-gray-100 overflow-hidden">
                    <img src="${imageSrc}" class="w-full h-full object-cover" alt="${item.name}">
                </div>
                <div class="p-5">
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="font-bold text-lg text-black">${item.name}</h3>
                        <span class="text-blue-700 font-bold">${item.price}</span>
                    </div>
                    <p class="text-gray-500 text-sm mb-1">${item.location} • ${item.category}</p>
                    ${mapBtn}
                    <p class="text-blue-600 text-xs font-bold mb-3">📞 ${item.phoneNumber || 'N/A'}</p>
                    <p class="text-gray-700 text-sm line-clamp-2 mb-4">${item.description}</p>
                    <button onclick="bookVendor('${item.name}', '${item.price}', '${item.location}', '${item.phoneNumber}')" class="w-full py-2.5 bg-blue-700 text-white rounded-lg font-bold hover:bg-blue-800 transition-all">Book Now</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function deleteListing(id) {
        if (confirm("Delete this listing permanently?")) {
            if (typeof Android !== 'undefined') {
                Android.deleteListing(id);
            }
        }
    }

    function viewOnMap(lat, lon, name) {
        if (typeof Android !== 'undefined' && Android.openMap) {
            Android.openMap(lat, lon);
        } else {
            const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
            window.location.href = url;
        }
    }

    function bookVendor(name, price, location, phone) {
        if (typeof Android !== 'undefined') {
            const date = new Date().toLocaleString();
            Android.sendBookingEmail(name, price, location, date, phone);

            // Wait 1 second before navigating to ensure the intent launches
            setTimeout(() => {
                window.location.href = "confirmed.html";
            }, 1000);
        } else {
            window.location.href = "confirmed.html";
        }
    }

        function updateWeatherUI(temp) {
            const display = document.getElementById('weatherDisplay');
            display.innerText = "Nairobi is currently " + temp;
            display.classList.remove('hidden');
        }

        function showNetworkStatus(isOnline) {
            console.log("Network status:", isOnline);
        }
    </script>
</body>
</html>
