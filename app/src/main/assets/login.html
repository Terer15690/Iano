<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top AppBar (Identity Only) -->
<header class="fixed top-0 w-full z-50 flex justify-center items-center px-4 h-20">
    <div class="flex items-center gap-2">
        <a href="index.html" class="font-display-lg text-headline-sm tracking-tight text-primary hover:opacity-80 transition-opacity">FABI</a>
    </div>
</header>
<main class="flex-grow flex items-center justify-center relative px-4 py-24">
    <!-- Atmospheric Background Element -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[100px]"></div>
    </div>
    <!-- Login Container -->
    <div class="w-full max-w-md z-10">
        <div class="glass-panel p-8 md:p-10 rounded-3xl shadow-[0_32px_64px_-16px_rgba(0,0,0,0.08)]">
            <div class="text-center mb-10">
                <h1 class="font-headline-md text-headline-md mb-2">Welcome Back</h1>
                <p class="text-on-surface-variant font-body-md">Sign in to manage your premium events</p>
            </div>
            <form class="space-y-6" onsubmit="event.preventDefault(); Android.openLogin();">
                <!-- Email Field -->
                <div class="space-y-2">
                    <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant block ml-1" for="email">Email Address</label>
                    <div class="relative flex items-center transition-all duration-200 border border-outline-variant/50 rounded-xl bg-surface-container-lowest input-focus-effect">
                        <span class="material-symbols-outlined absolute left-4 text-outline">mail</span>
                        <input class="w-full pl-12 pr-4 py-4 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline/60 rounded-xl" id="email" name="email" placeholder="name@company.com" type="email">
                    </div>
                </div>
                <!-- Password Field -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center ml-1">
                        <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant block" for="password">Password</label>
                        <a class="font-label-sm text-label-sm text-primary hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
                    </div>
                    <div class="relative flex items-center transition-all duration-200 border border-outline-variant/50 rounded-xl bg-surface-container-lowest input-focus-effect">
                        <span class="material-symbols-outlined absolute left-4 text-outline">lock</span>
                        <input class="w-full pl-12 pr-12 py-4 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline/60 rounded-xl" id="password" name="password" placeholder="••••••••" type="password">
                        <button class="absolute right-4 text-outline hover:text-primary transition-colors" type="button">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Submit Button -->
                <button class="w-full electric-gradient text-on-primary font-label-lg py-4 rounded-xl shadow-lg hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    <span class="">Log In</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>
            <!-- Divider -->
            <div class="flex items-center my-8">
                <div class="flex-grow h-px bg-outline-variant/30"></div>
                <span class="px-4 font-label-sm text-label-sm text-outline uppercase tracking-widest">or continue with</span>
                <div class="flex-grow h-px bg-outline-variant/30"></div>
            </div>
            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-4">

        </div>

</div>
<script>
    // Micro-interaction for form inputs
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('shadow-sm');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('shadow-sm');
        });
    });

    // Toggle password visibility (simplified mock)
    const passToggle = document.querySelector('button .material-symbols-outlined');
    if(passToggle && passToggle.textContent === 'visibility') {
        passToggle.parentElement.addEventListener('click', () => {
            const input = passToggle.parentElement.previousElementSibling;
            if(input.type === 'password') {
                input.type = 'text';
                passToggle.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                passToggle.textContent = 'visibility';
            }
        });
    }
</script>
